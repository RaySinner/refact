  final_report: |
    # Final Report

    ## Summary
    T-1: Dynamic context limits on model switch (Backend & GUI)

    **GUI (`middleware.ts` setChatModel listener)**
    - `wasAutoSet` (cap != null && cap === prevMax) replaced with `wasNotCustom` (cap == null OR (prevMax defined && cap === prevMax)).
    - `patch.context_tokens_cap` now becomes `modelMaxContextTokens` when the cap is null/undefined (was: `null`), or stays the original custom cap when the user picked a custom value.

    **GUI (`useCapsForToolUse.ts`)**
    - Verified `setCapModel` already passes `modelMaxContextTokens: tokens` and `previousModelMaxContextTokens: previousTokens`; no change needed.

    **Engine (`queue.rs` apply_setparams_patch)**
    1. New `else if model_changed` branch after `context_tokens_cap` handling: on a real model switch without an explicit `context_tokens_cap` in the patch, reset `thread.context_tokens_cap = None` (was: the previous model's ceiling silently kept). Marks `context_cap_changed` so downstream sanitization still propagates.
    2. `pending_auto_compression_cap_reset` now keys on `model_changed || context_cap_changed` instead of `patch.get("model").is_some() || patch.get("context_tokens_cap").is_some()`. This is the root cause of 4 pre-existing failing tests — the old key fired on same-model patches and on patches with only invalid-typed fields, which contradicted `!changed` assertions in `test_apply_setparams_no_change_same_value`, `test_same_model_preserves_previous_response_id`, `test_apply_setparams_invalid_types_ignored`, and `test_apply_setparams_context_tokens_cap_invalid_type_ignored` (all verified to fail at base 4e0c55102 via a base-queue.rs re-run).
    3. `invalidated_cap` kept its `thread.auto_compression_cap.is_some()` guard (an earlier variant added `|| model_changed` but the `pending_auto_compression_cap_reset` block already covers the force-set case; the two-path approach is redundant).
    4. Replaced `test_model_switch_without_prior_cap_does_not_add_null_to_sanitized` with `test_model_switch_without_prior_cap_sets_pending_auto_compression_cap` — asserts `context_tokens_cap == None`, `auto_compression_cap == None`, `auto_compression_cap_pending == true`, and sanitized `auto_compression_cap == null` on a real model switch with no prior cap (this matches the card's requirement that the engine doesn't keep the previous model's ceiling AND forces a pending recomputation).

    **Unrelated pre-existing test fix**
    - `message_provenance::tests::unknown_roles_are_stable_too` asserted `role_accent("another-special-role") != role_accent("special-role")` but both strings hash to the same slot (6th char + len%6 collide on 's' + 4). Changed the comparison target to `"different-role"`. Failure verified at base 496639d63.

    **New GUI tests**
    - `middleware.test.ts`: `"syncs model context cap on model switch when cap was undefined or null"` — dispatches `setChatModel` with `context_tokens_cap: undefined` on the old thread and asserts the outgoing `set_params` body is `{ model: "new-model", context_tokens_cap: 128000 }`.
    - `chatReducer.test.ts`: `"model_switch_updates_auto_context_cap_when_cap_was_undefined"` — asserts `context_tokens_cap` becomes 128000 after a model switch from a thread whose `context_tokens_cap` was `undefined`.

    **Verification**
    - `vitest run src/app/middleware.test.ts src/__tests__/chatReducer.test.ts` → 2 files, 63 tests, all pass.
    - `tsc --noEmit` → clean.
    - `eslint` + `prettier --check` on the 3 changed GUI files → clean.
    - `cargo test -p refact-chat-api` → 190 passed / 0 failed.
    - `cargo test -p refact-lsp chat::queue` → 98 passed / 0 failed (includes new test + the 4 previously-failing tests now passing).

    ## Result
    - Success: true

