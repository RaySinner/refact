  title: 'Engine: Universal loop breaker, investigation budget & stagnation detector'
  column: doing
  priority: P0
  depends_on:
  - T-5
  instructions: |-
    ## Goal
    Implement universal turn investigation budget, hard loop stop on Block, and stagnation detector in engine tool execution.

    ## Files
    - `refact-agent/engine/src/tools/tool_call_loop_guard.rs`
    - `refact-agent/engine/src/chat/tools.rs`
    - `refact-agent/engine/src/chat/types.rs`
    - `refact-agent/engine/src/chat/session.rs`

    ## Requirements
    1. **Universal application across ALL models and roles** (not just planner):
       - Every agent session tracks turn-level tool execution and recent tool history.
    2. **Investigation / Read-only Budget:**
       - Define classification for read-only / investigation tools: `cat`, `search_*`, `tree`, `glob`, `locate_files`, `codegraph_*`, `code_map`, `git_risk`, `web`, `web_search`, `knowledge`.
       - Track consecutive read-only calls in the current turn without any state-changing/mutating tool calls (`update_textdoc`, `create_textdoc`, `apply_patch`, `shell`, `board_*`, `doc_*`, `task_mem_*`, `ask_questions`, `spawn_agent*`, `agent_finish`, `task_done`).
       - When consecutive read-only calls reach `max_investigation_tool_calls_per_turn`, immediately stop executing subsequent tool calls in the turn and prepend/inject systemic message:
         `Investigation tool budget exhausted for this turn. Synthesize findings and proceed with action or final response now.`
    3. **Hard Loop Breaker on Block / Consecutive Warnings:**
       - When `tool_loop_hard_stop_on_block` is true: if a tool call gets `LoopVerdict::Block` (or 2 consecutive warnings in a row), abort executing remaining tools in the current batch/turn and set tool output instructing the model that repetitive calls are blocked and it must complete or change action.
    4. **Stagnation Detector:**
       - In `ToolCallLoopGuard` (or session tracker), track read keys/targets over the last N calls (`tool_loop_stagnation_threshold`). If targets repeat >2 times within this window with no state mutation, block further read calls in this turn.

    ## Tests
    - Unit tests in `tool_call_loop_guard.rs` and `chat/tools.rs`.
    - Run `cargo test --lib tool_call_loop_guard && cargo test --lib chat::tools`.

    ## Acceptance Criteria
    - [ ] Loop breaker and investigation budget work across any role and any model.
    - [ ] Hard stop terminates tool batch upon Block / budget exhaustion.
    - [ ] State-changing tools reset the investigation budget counter.
    - [ ] Unit tests pass.
