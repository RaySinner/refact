- id: T-4
  title: Route user messages to active subagent runners and persist in trajectory
  column: done
  priority: P0
  depends_on: []
  instructions: |
    ## Goal
    Fix user messages sent to subagent/child chat trajectories being silently dropped and overwritten.

    ## Files
    - `refact-agent/engine/src/chat/handlers.rs` (handle_v1_chat_command)
    - `refact-agent/engine/src/chat/delivery.rs` (deliver_to_chat & runner routing)
    - `refact-agent/engine/src/subchat.rs` (drain_background_agent_inbox & runner loop)
    - Integration or unit tests under `refact-agent/engine/tests/` or `crates/`

    ## Spec & Requirements
    1. When `handle_v1_chat_command` receives `ChatCommand::UserMessage { content, client_message_id, push, .. }` for a `chat_id`:
       - Check if this chat is owned by an active running background agent / subagent runner (`live_runner` or `find_agent_id_by_child_chat_id` / `has_runtime`).
       - If yes, route the user message through the unified delivery system (`deliver_to_chat` / `route_to_runner`) or directly enqueue it into the agent runner's inbox (`enqueue_delivery` / `deliver_to_agent`) as a delivery from the user.
       - If `push` is preempt (or user message in interactive subchat), request interruption or schedule delivery at the next turn boundary.
    2. In `subchat.rs`:
       - Ensure `drain_background_agent_inbox` (or runner inbox processor) injects user messages into the subchat trajectory with `role: "user"` or appropriate prompt framing.
       - Ensure the message is preserved across `mirror_subchat_messages_into_session` and persists on disk so reloading the trajectory retains the user message.
       - Ensure the subchat loop schedules a completion/next LLM step to respond to the injected user message.

    ## Tests
    - Add a test verifying that sending a `user_message` command to an active subagent's `child_chat_id` successfully delivers the message to the runner inbox and appends it to the subchat trajectory.

    ## Acceptance Criteria
    - [ ] User message sent to an active subchat trajectory is delivered to the subagent runner.
    - [ ] Reloading the subagent trajectory shows the user message.
    - [ ] Subagent reacts to the user message in its execution loop.
    - [ ] Verify: `cargo test -p refact-lsp --test test_background_agents` or targeted subchat / delivery tests.
