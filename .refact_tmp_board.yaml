- id: T-1
  title: Dynamic context limits on model switch (Backend & GUI)
  column: done
  priority: P0
  depends_on: []
  instructions: |-
    ## Goal
    Make context limits (`context_tokens_cap` and `auto_compression_cap`) dynamically adapt when changing chat models, so switching to a larger model (e.g. 1M) immediately applies the new model's context window without hitting premature compaction or context errors at the old limit.

    ## What to Implement:
    1. **Frontend (`refact-agent/gui/src/app/middleware.ts`)**:
       - In the `setChatModel` listener:
         When switching models, if `context_tokens_cap` was not explicitly set to a custom value by the user (i.e. it was equal to the previous model's max tokens, or was undefined/null), set `patch.context_tokens_cap` to `action.payload.modelMaxContextTokens`.
         Dispatch `set_params` command with `{ model, context_tokens_cap }`.

    2. **Frontend (`refact-agent/gui/src/hooks/useCapsForToolUse.ts`)**:
       - Verify `setCapModel` passes `modelMaxContextTokens: tokens` and `previousModelMaxContextTokens: previousTokens` correctly so the middleware knows the previous model limit.

    3. **Backend (`refact-agent/engine/src/chat/queue.rs`)**:
       - In `apply_setparams_patch`:
         When `patch` has a new `model`:
         If `patch` contains `context_tokens_cap`, apply it.
         If `patch` does NOT contain `context_tokens_cap`, reset `thread.context_tokens_cap = None` (or update to new model's limit) so that the engine doesn't keep the previous model's ceiling.
         Always set `thread.auto_compression_cap = None` and `thread.auto_compression_cap_pending = true`.

    4. **Tests & Verification**:
       - Update tests in `refact-agent/gui/src/app/middleware.test.ts` and `refact-agent/gui/src/__tests__/chatReducer.test.ts`.
       - Run: `cd refact-agent/gui && npm test -- src/app/middleware.test.ts src/__tests__/chatReducer.test.ts`
       - Run: `cargo test -p refact-chat-api`
       - Run: `cargo test -p refact-lsp chat::queue`
