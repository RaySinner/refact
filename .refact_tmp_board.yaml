  instructions: |-
    ## Goal
    Make `apply_deterministic_compaction_for_recovery` actually shrink conversations whose context is dominated by plain text (no context files, no tool outputs). Currently the full sweep only drops context files, memories, project-info system messages and truncates tool outputs — so a chat with one huge plain-text user message passes through UNCHANGED, `report` stays `None`, and recovery returns `false`. The test `chat::context_rebuild::tests::deterministic_recovery_sweeps_high_context_without_model_call` currently FAILS (`deterministic sweep must apply` panic at context_rebuild.rs:1690).

    ## Background
    - The sweep is wired in `generation.rs` as the last-resort fallback when the LLM context rebuild is unavailable (merged from T-2). It builds a request via `build_maximal_full_sweep_request` and calls `compress_chat_apply_head_output` in `refact-agent/engine/src/tools/tool_compress_chat.rs`.
    - `compress_chat_apply_head_output` only mutates: system project-info messages, `context_file` messages, multimodal elements, and `tool`/`diff` messages. Plain `user`/`assistant` SimpleText messages are never touched.
    - After the sweep, `apply_deterministic_compaction_for_recovery` (context_rebuild.rs ~line 1017) returns `false` when `report.is_none()` (i.e. `stats.has_meaningful_mutation()` was false).

    ## Spec
    1. In `compress_chat_apply_head_output` (or a helper it calls), add a deterministic plain-text reduction path that activates ONLY for the maximal full-sweep request (i.e. when `drop_all_context_files && drop_all_memories && truncate_all_tool_outputs && strip_images && drop_project_information` are all true — or better, add an explicit `bool reduce_plain_text` field to `CompressChatApplyRequest` set to `true` only by `build_maximal_full_sweep_request`; do NOT enable it for manual `compress_chat_apply` tool calls).
    2. Behavior of the plain-text reduction:
       - Work on the modifiable head (before `preserved_tail` is re-appended).
       - Identify consecutive runs of plain-text `user`/`assistant` messages (SimpleText content).
       - Keep the LAST user/assistant turn intact; for all OLDER plain-text user/assistant messages, replace the content with a short deterministic lossy marker, e.g. `"[compressed by deterministic recovery sweep: N characters of original conversation text removed]"` (N = original text length), preserving role, message_id and any non-content metadata.
       - Count every replaced message in a new stats field (e.g. `plain_text_reduced: usize`) and include it in `has_meaningful_mutation()` and in the fingerprint payload (`"reduce_plain_text": request.reduce_plain_text` is already in fingerprint only if you add it — add it).
       - The marker text itself must NOT match the project-info filter words in a way that makes the message get double-counted.
    3. The existing noop test `deterministic_recovery_is_noop_when_nothing_is_compressible` (tiny chat: single "tiny" user message) must STILL pass: a single tiny turn has nothing older than the last turn to reduce, so it must remain a noop.
    4. Do not change `build_maximal_full_sweep_request`'s other flags; keep the function signature (5 HashSets + tool_call_names) stable.
    5. Keep `pub(crate)` visibility on `CompressChatApplyRequest`/`CompressChatApplyStats` (already fixed in main).

    ## Verification (MANDATORY, run all, report exit codes)
    1. `cd refact-agent/engine && cargo test -p refact-lsp --lib context_rebuild` — all pass, including `deterministic_recovery_sweeps_high_context_without_model_call` and `deterministic_recovery_is_noop_when_nothing_is_compressible`.
    2. `cargo test -p refact-lsp --lib tool_compress_chat` — all 33+ existing tests still pass.
    3. `cargo check --workspace --all-targets` (via `tools\dev\engine-build.ps1` in the worktree root) — exit 0.
    Use `process_start`/`process_wait` for cargo (never synchronous shell, it times out at 10s).

    ## Acceptance Criteria
    - [ ] `cargo test -p refact-lsp --lib context_rebuild` → 0 failed
    - [ ] `cargo test -p refact-lsp --lib tool_compress_chat` → 0 failed
    - [ ] Manual `compress_chat_apply` tool behavior unchanged (its request does not set reduce_plain_text)
    - [ ] Verify: `cargo test -p refact-lsp --lib context_rebuild tool_compress_chat` exit 0

    ## Plan Traceability
    Master Plan Wave 1, T-2 fix (post-merge test failure)
