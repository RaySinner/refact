- id: T-2
  title: Context compaction reliability, 1M+ support & recovery fallback
  column: done
  priority: P0
  depends_on: []
  instructions: |-
    ## Goal
    Fix context compaction failure at high context usage: adapt `mode_transition` context limit for large models, ensure deterministic sweep fallback on LLM reconstruction failure, and prevent opaque "Unknown error" cards.

    ## Files
    - `refact-agent/engine/crates/refact-yaml-configs/src/defaults/subagents/mode_transition.yaml`
    - `refact-agent/engine/src/agentic/mode_transition.rs`
    - `refact-agent/engine/src/chat/context_rebuild.rs`
    - `refact-agent/engine/src/chat/generation.rs`
    - `refact-agent/engine/crates/refact-core/src/retry_policy.rs`

    ## Spec
    1. `mode_transition.yaml`:
       - Increase `subchat.n_ctx` or make it adapt to the model (200000 was hardcoded, failing when context exceeds 200k).
    2. `refact-agent/engine/src/agentic/mode_transition.rs`:
       - In `analyze_reconstruction`: ensure `config.n_ctx` reflects the resolved analyzer model's context window (`model_rec.base.n_ctx`), not clamped to 200k if the model supports 1M+.
       - Handle truncation gracefully if prompt exceeds input limit: if `tokens > input_limit`, ensure prompt reduces safely rather than immediately failing with `"Mandatory reconstruction input and instructions exceed resolved analyzer context"`.
    3. `refact-agent/engine/src/chat/context_rebuild.rs`:
       - In `apply_context_rebuild_with_reason`:
         When `rebuild_session` fails with `CompactionOutcome::LlmUnavailable` or an error, ensure error reporting gives a helpful, descriptive error rather than getting classified into `UserErrorCategory::Unknown`.
    4. `refact-agent/engine/src/chat/generation.rs`:
       - In the turn execution loop, when high-pressure or context-limit stop occurs:
         If `apply_context_rebuild_with_reason` fails (or has `NothingToCompact` / `LlmUnavailable`), execute `apply_deterministic_compaction_for_recovery` (deterministic full sweep) so the conversation is saved and generation can proceed, rather than immediately terminating with "Unknown error".
    5. `refact-agent/engine/crates/refact-core/src/retry_policy.rs`:
       - Add error pattern recognition for context rebuild / compaction errors so they are classified into a meaningful category (e.g. `ContextTooLarge` or descriptive title) rather than generic `UserErrorCategory::Unknown` with "The error did not match a known provider, network...".

    ## Requirements
    1. Compacting a conversation that is around 250k-1M tokens must not crash with "Unknown error".
    2. If LLM-based context rebuild fails (e.g. model context exceeded or model unavailable), automatic fallback to deterministic compaction sweep must take place.
    3. If an error is shown in UI, it must clearly explain the failure rather than "Unknown error".

    ## Tests
    - Unit tests in `refact-agent/engine/src/chat/context_rebuild.rs` covering fallback and high-token scenarios.
    - Unit tests in `refact-agent/engine/crates/refact-core/src/retry_policy.rs` verifying error classification for context rebuild failures.

    ## Acceptance Criteria
    - [ ] Context compaction does not fail due to a hardcoded 200k context limit.
    - [ ] Compaction failure falls back to deterministic full sweep when appropriate instead of failing turn generation.
    - [ ] Context rebuild errors provide human-understandable error messages instead of "Unknown error".
    - [ ] Verify: `cargo check -p refact-lsp && cargo test -p refact-core retry_policy`

    ## Plan Traceability
    Master Plan Wave 1, Card T-2
