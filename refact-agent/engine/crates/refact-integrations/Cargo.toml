[package]
name = "refact-integrations"
version = "0.1.0"
edition = "2021"

[dependencies]
refact-core = { path = "../refact-core" }
refact-tool-api = { path = "../refact-tool-api" }
async-trait = "0.1.73"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
indexmap.workspace = true
uuid.workspace = true
chrono = { version = "0.4.31", features = ["serde"] }
home = "0.5"
libc = "0.2"
strip-ansi-escapes = "0.2.1"
which = "7.0.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "stream", "rustls", "charset", "http2"] }
serde_yaml = "0.9.31"
url = "2.4.1"
oauth2 = { version = "5.0", default-features = false }
rmcp = { git = "https://github.com/modelcontextprotocol/rust-sdk", rev = "63583b164f54ec6ed2f17c98450487c747d34aeb", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "auth"] }

[dev-dependencies]
tempfile.workspace = true
axum = { version = "0.6.20", features = ["default", "http2"] }
