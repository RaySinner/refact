[package]
name = "refact-perf"
version = "0.1.0"
edition = "2021"

[features]
default = []
bench = ["dep:sysinfo", "dep:libc"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
rand = "0.8.5"
sha2 = "0.10.8"
hex = "0.4.3"
tracing.workspace = true
sysinfo = { version = "0.35.2", default-features = false, features = ["system"], optional = true }
libc = { workspace = true, optional = true }
