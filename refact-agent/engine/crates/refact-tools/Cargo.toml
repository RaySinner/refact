[package]
name = "refact-tools"
version = "0.1.0"
edition = "2021"

[dependencies]
refact-tool-api = { path = "../refact-tool-api" }
refact-runtime-api = { path = "../refact-runtime-api" }
refact-chat-api = { path = "../refact-chat-api" }
refact-chat-history = { path = "../refact-chat-history" }
refact-tasks = { path = "../refact-tasks" }
refact-core = { path = "../refact-core" }
refact-caps-core = { path = "../refact-caps-core" }
refact-agents-core = { path = "../refact-agents-core" }
refact-privacy = { path = "../refact-privacy" }
refact-files = { path = "../refact-files" }
refact-worktrees = { path = "../refact-worktrees" }
refact-postprocessing = { path = "../refact-postprocessing" }
refact-exec = { path = "../refact-exec" }
refact-yaml-configs = { path = "../refact-yaml-configs" }
refact-integrations = { path = "../refact-integrations" }
refact-buddy-core = { path = "../refact-buddy-core" }
refact-knowledge-graph = { path = "../refact-knowledge-graph" }
refact-scratchpads = { path = "../refact-scratchpads" }
refact-scheduler-core = { path = "../refact-scheduler-core" }
refact-perf = { path = "../refact-perf" }
refact-git-intel = { path = "../refact-git-intel" }
refact-codehealth = { path = "../refact-codehealth" }
refact-codegraph = { path = "../refact-codegraph" }

anyhow = "1.0.100"
async-trait = "0.1.73"
axum = { version = "0.6.20", features = ["default", "http2"] }
bytes = "1.11.0"
chrono = { version = "0.4.31", features = ["serde"] }
futures = "0.3"
git2 = "0.20.2"
glob = "0.3.1"
headless_chrome = "1.0.16"
indexmap = { version = "1.9.1", features = ["serde-1"] }
once_cell = "1.21.3"
regex = "1.9.5"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "stream", "rustls", "charset", "http2"] }
ropey = "1.6"
serde = { version = "1", features = ["rc", "derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
similar = "2.3.0"
thiserror = "2.0.12"
tokio = { version = "1.43.0", features = ["fs", "io-std", "io-util", "macros", "rt-multi-thread", "signal", "process", "time", "sync"] }
tokio-util = { version = "0.7.12", features = ["compat"] }
tracing = "0.1"
url = "2.4.1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
walkdir = "2.3"
